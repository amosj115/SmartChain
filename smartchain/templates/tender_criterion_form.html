{% extends 'base.html' %}
{% block title %}Add Evaluation Criterion{% endblock %}
{% block content %}
<div class="page-header"><div><span class="eyebrow">{{ tender.tender_number }} · Evaluation methodology</span><h1>{{ 'Edit criterion' if criterion else 'Create criterion' }}</h1><p>Set tender-specific scoring rules before evaluation starts.</p></div></div>
<form method="post" class="form-card"><div class="form-grid"><label>Criterion name<input type="text" name="name" value="{{ criterion.name if criterion else '' }}" required></label><label>Category<input name="category" value="{{ criterion.config.category if criterion and criterion.config else 'Functionality' }}"></label><label>Weight %<input type="number" step="0.01" name="weight" min="0.01" max="100" value="{{ criterion.weight if criterion else '' }}" required></label><label>Scoring framework<select name="scoring_framework">{% for framework in ['1-5', '1-10', 'Percentage', 'Points', 'Pass/Fail'] %}<option {% if criterion and criterion.scoring_framework == framework %}selected{% endif %}>{{ framework }}</option>{% endfor %}</select></label><label>Maximum score<input type="number" name="max_score" min="1" step="0.01" value="{{ criterion.max_score if criterion else 5 }}" required></label><label>Minimum qualifying score<input type="number" name="minimum_qualifying_score" min="0" step="0.01" value="{{ criterion.config.minimum_qualifying_score if criterion and criterion.config and criterion.config.minimum_qualifying_score is not none else '' }}"></label><label>Mandatory criterion<select name="mandatory"><option value="false" {% if not criterion or not criterion.config or not criterion.config.mandatory %}selected{% endif %}>No</option><option value="true" {% if criterion and criterion.config and criterion.config.mandatory %}selected{% endif %}>Yes</option></select></label><label>Evidence required<textarea name="evidence_required">{{ criterion.config.evidence_required if criterion and criterion.config else '' }}</textarea></label><label>Description<textarea name="description">{{ criterion.description if criterion else '' }}</textarea></label><label>Evaluator instructions<textarea name="instructions">{{ criterion.instructions if criterion else '' }}</textarea></label><label><input type="checkbox" name="pass_fail" value="true" {% if criterion and criterion.pass_fail %}checked{% endif %}> Pass/fail criterion</label></div><button class="primary-btn" type="submit">{{ 'Save criterion changes' if criterion else 'Save criterion' }}</button></form>
{% endblock %}
