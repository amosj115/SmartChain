{% extends 'base.html' %}
{% block title %}Create Vehicle{% endblock %}
{% block content %}
<div class="page-header"><div><span class="eyebrow">SmartFleet register</span><h1>Create vehicle</h1><p>Record the operational fleet asset for controlled allocation.</p></div></div>
<form method="post" class="form-card"><div class="form-grid"><label>Registration Number<input name="registration_number" required></label><label>Fleet Number<input name="fleet_number" required></label><label>Make<input name="make"></label><label>Model<input name="model"></label><label>Vehicle Type<input name="vehicle_type"></label><label>Fuel Type<select name="fuel_type"><option>Petrol</option><option>Diesel</option><option>Electric</option><option>Hybrid</option></select></label><label>Fuel Capacity<input type="number" step="0.01" name="fuel_capacity"></label><label>Current Odometer<input type="number" name="current_odometer" min="0" value="0"></label><label>Current Location<input name="current_location"></label><label>Next Service<input type="date" name="next_service"></label><label>Condition<select name="condition"><option>Good</option><option>Needs Inspection</option><option>Damaged</option></select></label><label>Notes<textarea name="notes"></textarea></label></div><button class="primary-btn" type="submit">Save vehicle</button></form>
{% endblock %}
