{% extends 'base.html' %}
{% block title %}Create Budget Forecast{% endblock %}
{% block content %}
<h2>Create Budget Forecast</h2>
<form method="post" class="form-card">
    <div class="form-grid">
        <label>Fiscal Year<input type="text" name="fiscal_year" value="2027" required></label>
        <label>Department<input type="text" name="department" required></label>
        <label>Allocation<input type="number" step="0.01" name="allocation" value="0"></label>
        <label>Expenditure<input type="number" step="0.01" name="expenditure" value="0"></label>
        <label>Variance<input type="number" step="0.01" name="variance" value="0"></label>
        <label>Status<select name="status"><option>On Track</option><option>At Risk</option><option>Over Budget</option></select></label>
    </div>
    <button type="submit" class="primary-btn">Save Forecast</button>
</form>
{% endblock %}
