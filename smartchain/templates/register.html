{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="page-header"><div><span class="eyebrow">Employee access</span><h1>Create your account</h1><p>Registration creates a controlled Employee account. Privileged roles are assigned by administrators.</p></div></div>
<form method="post" class="form-card"><div class="form-grid"><label>First Name<input name="first_name" required></label><label>Surname<input name="surname" required></label><label>Email Address<input type="email" name="email" required></label><label>Employee / Staff Number<input name="employee_number" required></label><label>Department<select name="department_id" required><option value="">Select department</option>{% for item in departments %}<option value="{{ item.id }}">{{ item.name }}</option>{% endfor %}</select></label><label>Directorate<select name="directorate_id" required><option value="">Select directorate</option>{% for item in directorates %}<option value="{{ item.id }}">{{ item.name }}</option>{% endfor %}</select></label><label>Unit<select name="unit_id" required><option value="">Select unit</option>{% for item in units %}<option value="{{ item.id }}">{{ item.name }}</option>{% endfor %}</select></label><label>Job Title<input name="job_title" required></label><label>Contact Number<input name="contact_number" required></label></div><button class="primary-btn" type="submit">Register employee</button></form>
{% endblock %}
